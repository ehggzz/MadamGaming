<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#101814">
  <meta name="description" content="MadamGaming — a little collection of offline games.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>MadamGaming</title>
</head>
<body>
  <main id="app">
    <section id="home" class="screen active">
      <div class="brand"><span>✨</span><h1>MadamGaming</h1><span>✨</span></div>
      <p class="subtitle">Pick a game and have fun!</p>
      <button class="game-card" id="playFlap"><span class="big-icon">🪽</span><span><strong>Flappy Friends</strong><small>Tap to fly!</small></span><span class="arrow">›</span></button>
      <div class="coming">More games coming soon! 💕</div>
      <p class="offline-note">📱 Works offline once installed</p>
    </section>

    <section id="characters" class="screen">
      <button class="back" data-screen="home">← Back</button>
      <h2>Choose your friend</h2>
      <div id="characterGrid" class="character-grid"></div>
      <button id="startGame" class="primary" disabled>Play! 🪽</button>
    </section>

    <section id="game" class="screen game-screen">
      <div class="hud"><button class="small-btn" id="quitGame">✕</button><div>⭐ <span id="score">0</span></div><div>🏆 <span id="best">0</span></div></div>
      <canvas id="gameCanvas" aria-label="Flappy Friends game"></canvas>
      <div id="tapHint" class="tap-hint">TAP TO FLY!</div>
    </section>

    <section id="gameOver" class="screen overlay-screen">
      <div class="result-card">
        <div id="resultCharacter" class="result-character">🐦</div>
        <h2>Bonk! 💫</h2>
        <p>Score: <strong id="finalScore">0</strong></p>
        <p id="newBest" class="new-best" hidden>🎉 New best score!</p>
        <button id="again" class="primary">Try again</button>
        <button id="changeCharacter" class="secondary">Change friend</button>
        <button id="homeButton" class="text-btn">Home</button>
      </div>
    </section>
  </main>
  <script src="game.js"></script>
</body>
</html>
