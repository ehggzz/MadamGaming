<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#101814">
  <meta name="description" content="MadamGaming — a little collection of offline games.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>MadamGaming</title>
</head>
<body>
  <main id="app">
    <section id="home" class="screen active">
      <div class="brand"><span>✨</span><h1>MadamGaming</h1><span>✨</span></div>
      <p class="subtitle">Pick a game and have fun!</p>
      <button class="game-card" id="playFlap"><span class="big-icon">🪽</span><span><strong>Flappy Friends</strong><small>Tap to fly!</small></span><span class="arrow">›</span></button>
      <button class="game-card" id="playMelody"><span class="big-icon">🎵</span><span><strong>Melody Hop</strong><small>Hop to the music!</small></span><span class="arrow">›</span></button>
      <div class="coming">More games coming soon! 💕</div>
      <p class="offline-note">📱 Works offline once installed</p>
    </section>

    <section id="characters" class="screen">
      <button class="back" data-screen="home">← Back</button>
      <h2>Choose your friend</h2>
      <div id="characterGrid" class="character-grid"></div>

      <button id="difficultyToggle" class="secondary settings-button" type="button">⚙️ Difficulty: <strong id="difficultyName">Easy</strong></button>
      <div id="difficultyPanel" class="difficulty-panel" hidden>
        <p class="difficulty-title">How tricky should it be?</p>
        <button class="difficulty-choice selected" data-difficulty="easy" type="button"><span>🌱</span><span><strong>Easy</strong><small>Slow and roomy — perfect for little players.</small></span></button>
        <button class="difficulty-choice" data-difficulty="normal" type="button"><span>⭐</span><span><strong>Normal</strong><small>A little faster with smaller gaps.</small></span></button>
        <button class="difficulty-choice" data-difficulty="hard" type="button"><span>🔥</span><span><strong>Hard</strong><small>Fast and challenging!</small></span></button>
      </div>

      <button id="startGame" class="primary" disabled>Play! 🪽</button>
    </section>

    <section id="game" class="screen game-screen">
      <div class="hud"><button class="small-btn" id="quitGame">✕</button><div>⭐ <span id="score">0</span></div><div>🏆 <span id="best">0</span></div></div>
      <canvas id="gameCanvas" aria-label="Flappy Friends game"></canvas>
      <div id="tapHint" class="tap-hint">TAP TO FLY!</div>
    </section>

    <section id="melodyGame" class="screen game-screen melody-screen">
      <div class="hud"><button class="small-btn" id="quitMelody">✕</button><div>🎵 <span id="melodyScore">0</span></div><div>🏆 <span id="melodyBest">0</span></div></div>
      <canvas id="melodyCanvas" aria-label="Melody Hop game"></canvas>
      <div id="melodyHint" class="melody-hint">SWIPE TO CHOOSE A PLATFORM!</div>
      <div class="lane-controls"><button id="laneLeft" aria-label="Move left">◀</button><button id="laneRight" aria-label="Move right">▶</button></div>
    </section>

    <section id="melodyOver" class="screen overlay-screen">
      <div class="result-card">
        <img id="melodyResultCharacter" class="result-character" src="characters/frog.svg" alt="Frog">
        <h2>Lovely hopping! 🎶</h2>
        <p>Platforms: <strong id="melodyFinalScore">0</strong></p>
        <p id="melodyNewBest" class="new-best" hidden>🎉 New best score!</p>
        <button id="melodyAgain" class="primary">Play again</button>
        <button id="melodyChange" class="secondary">Change friend</button>
        <button id="melodyHome" class="text-btn">Home</button>
      </div>
    </section>

    <section id="gameOver" class="screen overlay-screen">
      <div class="result-card">
        <img id="resultCharacter" class="result-character" src="characters/magpie.svg" alt="Magpie">
        <h2>Bonk! 💫</h2>
        <p>Score: <strong id="finalScore">0</strong></p>
        <p id="newBest" class="new-best" hidden>🎉 New best score!</p>
        <button id="again" class="primary">Try again</button>
        <button id="changeCharacter" class="secondary">Change friend</button>
        <button id="homeButton" class="text-btn">Home</button>
      </div>
    </section>
  </main>
  <script src="melody-hop.js"></script>
  <script src="game.js"></script>
</body>
</html>
