name: Build PWA icons

on:
  push:
    branches: [main]
    paths:
      - 'icons/rainbow-n.svg'
      - '.github/workflows/build-pwa-icon.yml'

permissions:
  contents: write

jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
      - name: Build app icons from the single source artwork
        run: |
          magick -background none icons/rainbow-n.svg -resize 180x180 icons/madamgaming-icon-180.png
          magick -background none icons/rainbow-n.svg -resize 192x192 icons/madamgaming-icon-192.png
          magick -background none icons/rainbow-n.svg -resize 512x512 icons/madamgaming-icon-512.png
      - name: Commit generated PNG icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/madamgaming-icon-180.png icons/madamgaming-icon-192.png icons/madamgaming-icon-512.png
          git diff --cached --quiet || git commit -m "Build final MadamGaming app icons"
          git push

# The SVG is the source of truth; PNG sizes are rebuilt automatically on GitHub.
