name: Build PWA icons

on:
  push:
    branches: [main]
    paths:
      - 'icons/rainbow-n.svg'
      - '.github/workflows/build-pwa-icon.yml'

permissions:
  contents: write

jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
      - name: Build final MadamGaming PNG icons
        run: |
          rsvg-convert -w 180 -h 180 icons/rainbow-n.svg -o icons/madamgaming-rainbow-n-180.png
          rsvg-convert -w 192 -h 192 icons/rainbow-n.svg -o icons/madamgaming-rainbow-n-192.png
          rsvg-convert -w 512 -h 512 icons/rainbow-n.svg -o icons/madamgaming-rainbow-n-512.png
      - name: Commit generated PNG icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          git add icons/madamgaming-rainbow-n-180.png icons/madamgaming-rainbow-n-192.png icons/madamgaming-rainbow-n-512.png
          git diff --cached --quiet || git commit -m "Build unmistakable rainbow N app icons"
          git push origin HEAD:main
